server_url: ${HS_SERVER_URL:-http://localhost:8080}
listen_addr: 0.0.0.0:${HS_PORT:-8080}
metrics_listen_addr: 0.0.0.0:${HS_METRICS_PORT:-9090}
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

private_key_path: /var/lib/headscale/private.key

noise:
  private_key_path: /var/lib/headscale/noise_private.key

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

dns:
  magic_dns: true
  base_domain: ${HS_BASE_DOMAIN:-headscale.internal}
  override_local_dns: true
  nameservers:
    global:
      - ${HS_DNS1:-1.1.1.1}
      - ${HS_DNS2:-1.0.0.1}

policy:
  mode: file
  path: /etc/headscale/acl_policy.hujson

log:
  level: ${HS_LOG_LEVEL:-info}
  format: text

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

default_preauth_key_expiry: 24h
